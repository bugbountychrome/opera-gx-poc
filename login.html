<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opera GX - Security Alert</title>
    <style>
        /* Reset Dasar */
        body { 
            margin: 0; padding: 0; 
            background-color: #111; /* Latar belakang halaman dibuat gelap */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
        }
        
        /* Overlay Gelap (Efek saat alert muncul) */
        .alert-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); /* Transparan gelap */
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }

        /* Kotak Alert (Gaya Mirip Sistem Android) */
        .alert-box {
            background: #2c2c36; /* Warna khas Opera GX */
            width: 85%; max-width: 320px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            border: 1px solid #3a3a45;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Animasi muncul */
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Header Alert */
        .alert-header {
            padding: 20px 20px 10px 20px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        /* Isi Alert */
        .alert-body {
            padding: 0 20px 20px 20px;
        }

        .alert-body p {
            margin: 0 0 15px 0;
            font-size: 14px;
            color: #b0b0b0;
            line-height: 1.4;
        }

        /* Form Input di dalam Alert */
        .alert-body input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #1e1e24;
            color: white;
            box-sizing: border-box;
            font-size: 15px;
        }
        .alert-body input:focus { outline: none; border-color: #ff1b2d; }

        /* Footer Alert (Tombol-tombol) */
        .alert-footer {
            display: flex;
            border-top: 1px solid #3a3a45;
        }

        .alert-btn {
            flex: 1;
            padding: 15px;
            background: transparent;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        /* Tombol Cancel (Kiri) */
        .btn-cancel { 
            color: #a0a0a0; 
            border-right: 1px solid #3a3a45; 
        }
        .btn-cancel:hover { background: #3a3a45; }

        /* Tombol Sign In (Kanan) */
        .btn-login { 
            color: #ff1b2d; 
        }
        .btn-login:hover { background: rgba(255, 27, 45, 0.1); }

        /* Pesan PoC untuk Triage Bugcrowd */
        .poc-msg {
            display: none;
            margin: 15px 20px 20px 20px;
            padding: 10px;
            background: rgba(255, 27, 45, 0.1);
            border: 1px solid #ff1b2d;
            border-radius: 6px;
            color: #ff1b2d;
            font-size: 11px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Custom Alert Modal -->
    <div class="alert-overlay">
        <div class="alert-box">
            <div class="alert-header">Security Alert</div>
            
            <div class="alert-body">
                <p>Your Opera GX session has expired. Please verify your credentials to continue.</p>
                
                <!-- Form Login -->
                <form onsubmit="event.preventDefault(); alert('Simulasi Phishing: Kredensial berhasil dicuri!');">
                    <input type="email" placeholder="Opera Account Email" required>
                    <input type="password" placeholder="Password" required>
                    
                    <!-- Tombol-tombol -->
                    <div class="alert-footer" style="margin: 10px -20px -20px -20px;">
                        <button type="button" class="alert-btn btn-cancel" onclick="document.body.innerHTML='<h1 style=color:white;text-align:center;margin-top:50%>Cancelled</h1>'">Cancel</button>
                        <button type="submit" class="alert-btn btn-login">Sign In</button>
                    </div>
                </form>
            </div>
            
            <!-- PoC Alert untuk Triage -->
            <div id="poc-alert" class="poc-msg"></div>
            <script>
                // Menampilkan bukti spoofing jika URL mengandung '@'
                if (window.location.href.includes('@')) {
                    const alertBox = document.getElementById('poc-alert');
                    alertBox.style.display = 'block';
                    alertBox.innerHTML = "⚠️ PoC Success: Address Bar Spoofing.<br>Actual Host: <b>" + window.location.host + "</b>";
                }
            </script>
        </div>
    </div>

</body>
</html>
