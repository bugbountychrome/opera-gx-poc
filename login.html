<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opera GX - Sign In</title>
    <style>
        /* Styling Dasar Halaman */
        body { background-color: #1e1e24; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; overflow: hidden; }
        
        /* Overlay Gelap di Belakang Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); /* Dibuat gelap agar fokus ke form */
            display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
            z-index: 9999;
        }

        /* Kotak Form Login */
        .login-box {
            background: #2c2c36;
            width: 85%; max-width: 350px;
            padding: 30px 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border: 1px solid #444;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo { color: #ff1b2d; font-size: 40px; font-weight: 900; margin-bottom: 5px; letter-spacing: -1px; }
        h2 { margin: 0 0 5px 0; font-size: 18px; }
        p { color: #a0a0a0; font-size: 13px; margin-bottom: 25px; }
        
        input { 
            width: 100%; padding: 14px; margin: 8px 0; 
            border-radius: 6px; border: 1px solid #555; 
            background: #1e1e24; color: white; box-sizing: border-box; font-size: 15px;
        }
        input:focus { outline: none; border-color: #ff1b2d; }
        
        button { 
            width: 100%; padding: 14px; 
            background: #ff1b2d; color: white; border: none; 
            border-radius: 6px; font-weight: bold; font-size: 16px; 
            margin-top: 15px; cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: #d61021; }

        /* Kotak Peringatan PoC */
        .poc-alert { 
            display: none; margin-top: 20px; padding: 12px; 
            background: rgba(255, 27, 45, 0.1); border: 1px solid #ff1b2d; 
            border-radius: 6px; color: #ff1b2d; font-size: 12px; font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Overlay Modal (Langsung Muncul Tanpa Alert Browser) -->
    <div class="modal-overlay">
        <div class="login-box">
            <div class="logo">Opera GX</div>
            <h2>Session Expired</h2>
            <p>Please verify your credentials to continue.</p>
            
            <form onsubmit="event.preventDefault(); alert('Simulasi Phishing: Kredensial berhasil dicuri!');">
                <input type="email" placeholder="Email address" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>

            <!-- Notifikasi untuk Triage Opera (Membuktikan Spoofing) -->
            <div id="poc-alert" class="poc-alert"></div>
            <script>
                // Memastikan URL mengandung trik '@' saat form dimuat
                if (window.location.href.includes('@')) {
                    const alertBox = document.getElementById('poc-alert');
                    alertBox.style.display = 'block';
                    alertBox.innerHTML = "⚠️ PoC Success: Address Bar Spoofing.<br>Actual Host: <b>" + window.location.host + "</b>";
                }
            </script>
        </div>
    </div>

</body>
</html>
