<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTS AutoPlay Test</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  h1 { color: #58a6ff; }
  .status {
    padding: 12px 20px;
    border-radius: 8px;
    background: #161b22;
    border: 1px solid #30363d;
    margin: 10px;
    font-family: monospace;
  }
  .ok { border-color: #238636; color: #3fb950; }
  .err { border-color: #da3633; color: #f85149; }
  #log {
    max-width: 600px;
    width: 100%;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 15px;
    font-family: monospace;
    font-size: 13px;
    max-height: 300px;
    overflow-y: auto;
  }
  .log-line { margin: 3px 0; }
  .log-info { color: #58a6ff; }
  .log-ok { color: #3fb950; }
  .log-err { color: #f85149; }
  .log-warn { color: #d29922; }
</style>
</head>
<body>
  <h1>🔊 TTS AutoPlay Test</h1>
  <div id="status" class="status">Waiting...</div>
  <div id="log"></div>

<script>
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');

function log(msg, type = 'info') {
  const line = document.createElement('div');
  line.className = `log-line log-${type}`;
  const t = new Date().toLocaleTimeString();
  line.textContent = `[${t}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  console.log(`[${type}] ${msg}`);
}

function setStatus(msg, ok) {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + (ok ? 'ok' : 'err');
}

// ============================================
// TEXT TO BE SPOKEN
// ============================================
const TEXT = "Hello, this is an automated text to speech test with no user interaction.";

// ============================================
// METHOD 1: Web Speech API (SpeechSynthesis)
// ============================================
function trySpeechSynthesis() {
  log('Trying SpeechSynthesis...', 'info');
  
  if (!('speechSynthesis' in window)) {
    log('SpeechSynthesis not supported', 'err');
    return false;
  }

  // Trick: speaking before voices load sometimes fails
  const speak = () => {
    const utter = new SpeechSynthesisUtterance(TEXT);
    utter.lang = 'en-US';
    utter.rate = 1;
    utter.pitch = 1;
    utter.volume = 1;

    utter.onstart = () => {
      log('✅ SpeechSynthesis STARTED (autoplay succeeded!)', 'ok');
      setStatus('✅ Audio playing via SpeechSynthesis', true);
    };
    utter.onend = () => log('SpeechSynthesis finished', 'ok');
    utter.onerror = (e) => {
      log(`❌ SpeechSynthesis error: ${e.error}`, 'err');
      setStatus('❌ SpeechSynthesis failed: ' + e.error, false);
    };

    window.speechSynthesis.speak(utter);
    log('speak() called', 'info');
  };

  // Chrome: voices are often empty on first call, wait for voiceschanged
  if (speechSynthesis.getVoices().length === 0) {
    log('Voices not loaded yet, waiting for voiceschanged...', 'warn');
    speechSynthesis.onvoiceschanged = () => {
      log(`Voices loaded: ${speechSynthesis.getVoices().length}`, 'info');
      speak();
    };
    // Fallback timeout
    setTimeout(() => {
      if (speechSynthesis.getVoices().length > 0) speak();
    }, 500);
  } else {
    speak();
  }
  return true;
}

// ============================================
// METHOD 2: Audio element with data URI / remote
// (for testing standard audio autoplay policy)
// ============================================
function tryAudioElement() {
  log('Trying Audio element autoplay...', 'info');
  
  // Silent WAV base64 (0.5s)
  const silentWav = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
  
  const audio = new Audio(silentWav);
  audio.autoplay = true;
  
  const playPromise = audio.play();
  if (playPromise !== undefined) {
    playPromise
      .then(() => {
        log('✅ Audio element autoplay SUCCEEDED', 'ok');
      })
      .catch(err => {
        log(`❌ Audio element autoplay BLOCKED: ${err.name} - ${err.message}`, 'err');
        log('(This is normal — browser requires a user gesture)', 'warn');
      });
  }
}

// ============================================
// METHOD 3: Trick — try resume() after delay
// Some browsers allow it once tab is visible/focused
// ============================================
function tryResumeTrick() {
  log('Trying resume() trick...', 'info');
  window.speechSynthesis.resume();
  
  // Retry speak if paused
  if (window.speechSynthesis.paused) {
    log('SpeechSynthesis paused, attempting resume', 'warn');
    window.speechSynthesis.resume();
  }
}

// ============================================
// RUN EVERYTHING
// ============================================
window.addEventListener('load', () => {
  log('Page loaded, starting autoplay test', 'info');
  log(`User agent: ${navigator.userAgent}`, 'info');
  
  // Method 1
  trySpeechSynthesis();
  
  // Method 2 (parallel)
  tryAudioElement();
  
  // Method 3 (delayed)
  setTimeout(tryResumeTrick, 1000);
  
  // Monitor state
  setInterval(() => {
    if (window.speechSynthesis.speaking) {
      setStatus('🔊 Speaking...', true);
    }
  }, 2000);
});

// Log visibility state (for bug bounty research)
document.addEventListener('visibilitychange', () => {
  log(`Visibility: ${document.visibilityState}`, 'warn');
});
</script>
</body>
</html>
