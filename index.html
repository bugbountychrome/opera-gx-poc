<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTS AutoPlay Test</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  h1 { color: #58a6ff; }
  .status {
    padding: 12px 20px;
    border-radius: 8px;
    background: #161b22;
    border: 1px solid #30363d;
    margin: 10px;
    font-family: monospace;
  }
  .ok { border-color: #238636; color: #3fb950; }
  .err { border-color: #da3633; color: #f85149; }
  #log {
    max-width: 600px;
    width: 100%;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 15px;
    font-family: monospace;
    font-size: 13px;
    max-height: 300px;
    overflow-y: auto;
  }
  .log-line { margin: 3px 0; }
  .log-info { color: #58a6ff; }
  .log-ok { color: #3fb950; }
  .log-err { color: #f85149; }
  .log-warn { color: #d29922; }
</style>
</head>
<body>
  <h1>🔊 TTS AutoPlay Test</h1>
  <div id="status" class="status">Menunggu...</div>
  <div id="log"></div>

<script>
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');

function log(msg, type = 'info') {
  const line = document.createElement('div');
  line.className = `log-line log-${type}`;
  const t = new Date().toLocaleTimeString();
  line.textContent = `[${t}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  console.log(`[${type}] ${msg}`);
}

function setStatus(msg, ok) {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + (ok ? 'ok' : 'err');
}

// ============================================
// TEKS YANG AKAN DIBACAKAN
// ============================================
const TEKS = "Halo, ini adalah tes text to speech otomatis tanpa interaksi user.";

// ============================================
// METODE 1: Web Speech API (SpeechSynthesis)
// ============================================
function trySpeechSynthesis() {
  log('Mencoba SpeechSynthesis...', 'info');
  
  if (!('speechSynthesis' in window)) {
    log('SpeechSynthesis tidak didukung', 'err');
    return false;
  }

  // Trik: trigger speak saat voices belum load kadang gagal
  const speak = () => {
    const utter = new SpeechSynthesisUtterance(TEKS);
    utter.lang = 'id-ID';
    utter.rate = 1;
    utter.pitch = 1;
    utter.volume = 1;

    utter.onstart = () => {
      log('✅ SpeechSynthesis STARTED (autoplay berhasil!)', 'ok');
      setStatus('✅ Audio playing via SpeechSynthesis', true);
    };
    utter.onend = () => log('SpeechSynthesis selesai', 'ok');
    utter.onerror = (e) => {
      log(`❌ SpeechSynthesis error: ${e.error}`, 'err');
      setStatus('❌ SpeechSynthesis gagal: ' + e.error, false);
    };

    window.speechSynthesis.speak(utter);
    log('speak() dipanggil', 'info');
  };

  // Chrome: voices sering kosong saat pertama, tunggu voiceschanged
  if (speechSynthesis.getVoices().length === 0) {
    log('Voices belum loaded, menunggu voiceschanged...', 'warn');
    speechSynthesis.onvoiceschanged = () => {
      log(`Voices loaded: ${speechSynthesis.getVoices().length}`, 'info');
      speak();
    };
    // Fallback timeout
    setTimeout(() => {
      if (speechSynthesis.getVoices().length > 0) speak();
    }, 500);
  } else {
    speak();
  }
  return true;
}

// ============================================
// METODE 2: Audio element dengan data URI / remote
// (untuk tes autoplay policy audio biasa)
// ============================================
function tryAudioElement() {
  log('Mencoba Audio element autoplay...', 'info');
  
  // Pakai file audio silent / beep pendek (base64 WAV 0.5s silent)
  const silentWav = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
  
  const audio = new Audio(silentWav);
  audio.autoplay = true;
  
  const playPromise = audio.play();
  if (playPromise !== undefined) {
    playPromise
      .then(() => {
        log('✅ Audio element autoplay BERHASIL', 'ok');
      })
      .catch(err => {
        log(`❌ Audio element autoplay DIBLOKIR: ${err.name} - ${err.message}`, 'err');
        log('(Ini normal — browser butuh user gesture)', 'warn');
      });
  }
}

// ============================================
// METODE 3: Tricky — coba resume() setelah delay
// Beberapa browser mengizinkan setelah tab visible/focus
// ============================================
function tryResumeTrick() {
  log('Mencoba resume() trick...', 'info');
  window.speechSynthesis.resume();
  
  // Coba panggil ulang speak jika paused
  if (window.speechSynthesis.paused) {
    log('SpeechSynthesis paused, mencoba resume', 'warn');
    window.speechSynthesis.resume();
  }
}

// ============================================
// JALANKAN SEMUA
// ============================================
window.addEventListener('load', () => {
  log('Page loaded, mulai autoplay test', 'info');
  log(`User agent: ${navigator.userAgent}`, 'info');
  
  // Metode 1
  trySpeechSynthesis();
  
  // Metode 2 (paralel)
  tryAudioElement();
  
  // Metode 3 (delayed)
  setTimeout(tryResumeTrick, 1000);
  
  // Monitor state
  setInterval(() => {
    if (window.speechSynthesis.speaking) {
      setStatus('🔊 Sedang berbicara...', true);
    }
  }, 2000);
});

// Log visibility state (buat riset bug bounty)
document.addEventListener('visibilitychange', () => {
  log(`Visibility: ${document.visibilityState}`, 'warn');
});
</script>
</body>
</html>
